<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img"
     aria-label="Las cuatro vias de la nausea y el antiemetico que corresponde a cada una">
  <title>Las cuatro vías de la náusea y su antiemético</title>
  <desc>Esquema propio. Autor: Jeshua Romero Guadarrama.</desc>
  <style>
    .fondo { fill: #faf8fd; }
    .txt   { fill: #1e1830; font-family: "Segoe UI", system-ui, sans-serif; }
    .txt2  { fill: #55496b; font-family: "Segoe UI", system-ui, sans-serif; }
    .txt3  { fill: #837792; font-family: "Segoe UI", system-ui, sans-serif; }
    .centro{ fill: #ede9fe; stroke: #6d4aa8; }
    .v1 { fill: #ffe4e9; stroke: #be123c; }
    .v2 { fill: #e0f2fe; stroke: #0369a1; }
    .v3 { fill: #dcfce7; stroke: #15803d; }
    .v4 { fill: #fef3c7; stroke: #b45309; }
    .lin { stroke: #9b7ede; }
    @media (prefers-color-scheme: dark) {
      .fondo { fill: #231c3b; }
      .txt   { fill: #efe9f8; }
      .txt2  { fill: #b6a9cd; }
      .txt3  { fill: #8b7da3; }
      .centro{ fill: #322657; stroke: #b79bf0; }
      .v1 { fill: #3d1220; stroke: #fda4b8; }
      .v2 { fill: #0a2b42; stroke: #7cc7e8; }
      .v3 { fill: #0d3320; stroke: #6ee7a8; }
      .v4 { fill: #3a2a09; stroke: #fcd34d; }
      .lin { stroke: #b79bf0; }
    }
  </style>

  <rect class="fondo" width="640" height="420" rx="12"/>
  <text class="txt3" x="320" y="30" font-size="12.5" text-anchor="middle" font-style="italic">Antes de prescribir un antiemético, preguntarse cuál es el mecanismo</text>

  <!-- Centro -->
  <rect class="centro" x="236" y="176" width="168" height="64" rx="14" stroke-width="2"/>
  <text class="txt" x="320" y="203" font-size="14" font-weight="700" text-anchor="middle">Centro del vómito</text>
  <text class="txt2" x="320" y="223" font-size="12.5" text-anchor="middle">recibe de cuatro fuentes</text>

  <!-- Lineas -->
  <line class="lin" x1="236" y1="196" x2="180" y2="140" stroke-width="2"/>
  <line class="lin" x1="404" y1="196" x2="460" y2="140" stroke-width="2"/>
  <line class="lin" x1="236" y1="220" x2="180" y2="276" stroke-width="2"/>
  <line class="lin" x1="404" y1="220" x2="460" y2="276" stroke-width="2"/>

  <!-- 1 Quimiorreceptora -->
  <rect class="v1" x="24" y="52" width="264" height="90" rx="10" stroke-width="1.6"/>
  <text class="txt" x="44" y="76" font-size="13.5" font-weight="700">Zona gatillo quimiorreceptora</text>
  <text class="txt2" x="44" y="96" font-size="12.5">Opioides, uremia, hipercalcemia,</text>
  <text class="txt2" x="44" y="112" font-size="12.5">insuficiencia hepática, quimioterapia</text>
  <text class="txt" x="44" y="132" font-size="12.5" font-weight="700">Dopaminérgica: Haloperidol</text>

  <!-- 2 Vestibular -->
  <rect class="v2" x="352" y="52" width="264" height="90" rx="10" stroke-width="1.6"/>
  <text class="txt" x="372" y="76" font-size="13.5" font-weight="700">Aparato vestibular</text>
  <text class="txt2" x="372" y="96" font-size="12.5">Empeora con el movimiento,</text>
  <text class="txt2" x="372" y="112" font-size="12.5">hipertensión intracraneal</text>
  <text class="txt" x="372" y="132" font-size="12.5" font-weight="700">Histaminérgica: Dimenhidrinato</text>

  <!-- 3 Digestiva -->
  <rect class="v3" x="24" y="274" width="264" height="90" rx="10" stroke-width="1.6"/>
  <text class="txt" x="44" y="298" font-size="13.5" font-weight="700">Tubo digestivo</text>
  <text class="txt2" x="44" y="318" font-size="12.5">Quimioterapia, radioterapia,</text>
  <text class="txt2" x="44" y="334" font-size="12.5">estasis gástrica, distensión</text>
  <text class="txt" x="44" y="354" font-size="12.5" font-weight="700">Serotoninérgica: Ondansetrón</text>

  <!-- 4 Cortical -->
  <rect class="v4" x="352" y="274" width="264" height="90" rx="10" stroke-width="1.6"/>
  <text class="txt" x="372" y="298" font-size="13.5" font-weight="700">Corteza cerebral</text>
  <text class="txt2" x="372" y="318" font-size="12.5">Ansiedad, náusea anticipatoria,</text>
  <text class="txt2" x="372" y="334" font-size="12.5">olores y recuerdos</text>
  <text class="txt" x="372" y="354" font-size="12.5" font-weight="700">Benzodiacepina: Lorazepam</text>

  <!-- Nota -->
  <text class="txt3" x="320" y="392" font-size="12.5" text-anchor="middle">Si el mecanismo es múltiple o no se identifica: Levomepromazina, que cubre varios receptores</text>
  <text class="txt3" x="320" y="410" font-size="12.5" text-anchor="middle">La dexametasona es coadyuvante de cualquiera de las cuatro vías</text>
</svg>
